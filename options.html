<!DOCTYPE html>
<html>
<head>
  <title>YouTube Redirect Options</title>
</head>
<body>
  <h1>YouTube Redirect Options</h1>
  
  <label for="redirectUrl">Redirect URL:</label><br>
  <input type="url" id="redirectUrl" placeholder="https://example.com/?video={videoId}" style="width: 300px;">
  <br><br>
  <button id="save">Save</button>
  <br><br>
  <div id="status"></div>
  
  <p>Use <code>{videoId}</code> as a placeholder for the YouTube video ID.</p>
  
  <script src="options.js"></script>
</body>
</html>
